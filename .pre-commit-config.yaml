repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files # Prevent giant files from being committed
      - id: check-case-conflict # Checks for files that conflict in case-insensitive filesystems
      - id: check-json # Attempts to load all json files to verify syntax
      - id: check-merge-conflict # Check for files that contain merge conflict strings
      - id: check-symlinks # Checks for symlinks which do not point to anything
      - id: check-xml # Attempts to load all xml files to verify syntax
      - id: check-yaml # Attempts to load all yaml files to verify syntax
      - id: debug-statements # Check for debugger imports and breakpoint() calls in python code
      - id: end-of-file-fixer # Makes sure files end in a newline and only a newline
      - id: trailing-whitespace # Trims trailing whitespace

  - repo: local
    hooks:
      - id: ruff-lint
        name: "Lint Python code with ruff"
        entry: "uv run ruff check --fix"
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: "Fix Python formatting with ruff"
        entry: "uv run ruff format"
        language: system
        types: [python]
        require_serial: true

      - id: ty
        name: "Check type hints with ty"
        language: system
        entry: "uv run ty check"
        types: [python]
        require_serial: true
        pass_filenames: false

      - id: pytest
        name: "Run tests with pytest"
        language: system
        entry: "make test"
        require_serial: true
        pass_filenames: false
        always_run: true

      - id: check-all-migrations-generated
        name: "Check all migrations are generated"
        language: system
        entry: "make discover_missing_migrations"
        require_serial: true
        pass_filenames: false
        always_run: true
